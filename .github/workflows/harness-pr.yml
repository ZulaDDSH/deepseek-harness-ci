name: Harness PR checks

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Harness pull request number
        required: true
        default: '137'
        type: string
      regenerate_workflow_guest:
        description: Generate workflow guest source as an artifact
        required: false
        default: false
        type: boolean
      regenerate_catalogs:
        description: Generate persistence catalogs as an artifact
        required: false
        default: false
        type: boolean
      record_jev_removal:
        description: Generate the approved JEV removal acknowledgement for PR 137
        required: false
        default: false
        type: boolean
      head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/ZulaDDSH/deepseek-harness/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          head=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
          base=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")
          [[ "$head" == "$EXPECTED_SHA" ]] || { echo 'The PR head changed; dispatch with its current SHA.'; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            lane: static
          - runner: ubuntu-latest
            lane: unit
          - runner: windows-2025
            lane: windows
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.lane }} / ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_ARCHIVE_BASE_REF: ${{ needs.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ZulaDDSH/deepseek-harness
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Linux sandbox
        if: matrix.lane == 'unit'
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Static checks
        if: matrix.lane == 'static'
        run: pnpm run check:ci:static
      - name: Unit tests
        if: matrix.lane == 'unit'
        run: pnpm run check:ci:unit
      - name: Windows builds
        if: matrix.lane == 'windows'
        run: pnpm run check:ci:windows-blocking

  workflow-guest:
    if: inputs.regenerate_workflow_guest || inputs.regenerate_catalogs || inputs.record_jev_removal
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ZulaDDSH/deepseek-harness
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - name: Confirm JEV record target
        if: inputs.record_jev_removal
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          [[ "$PR_NUMBER" == '137' ]] || { echo 'The JEV acknowledgement is restricted to PR 137.'; exit 1; }
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - if: inputs.regenerate_workflow_guest
        run: pnpm exec tsx scripts/gen-workflow-guest.ts
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.regenerate_workflow_guest
        with:
          name: workflow-guest-${{ needs.resolve.outputs.head }}
          path: packages/workflow/workflow-ptc/src/guest-source.ts
          if-no-files-found: error
      - if: inputs.regenerate_catalogs || inputs.record_jev_removal
        run: |
          pnpm exec tsx scripts/gen-persistence-catalog.ts
          pnpm exec tsx scripts/persistence-formats.ts --write
      - name: Record approved JEV removal
        if: inputs.record_jev_removal
        run: |
          cat > "$RUNNER_TEMP/jev-removal-prose.json" <<'JSON'
          {
            "en": {
              "summary": "Remove JEV decision events and JEV role settings.",
              "compatibility": "Existing sessions using these formats are not supported; the project owner confirmed they are no longer needed.",
              "verification": "The source and generated catalogs remove JEV. The CI persistence checks validate this acknowledgement."
            }
          }
          JSON
          pnpm exec tsx scripts/persistence-changes.ts --record 2026-11-16-jev-removal --decision same-version --prose "$RUNNER_TEMP/jev-removal-prose.json" --json
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.regenerate_catalogs || inputs.record_jev_removal
        with:
          name: persistence-catalogs-${{ needs.resolve.outputs.head }}
          path: |
            docs/persistence-catalog.md
            docs/experimental-persistence-catalog.md
            docs/persistence-schema.json
            docs/persistence-changes/historical-formats/README.md
            docs/persistence-changes/historical-formats/v*.md
            packages/core/session/src/known-event-types.ts
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.record_jev_removal
        with:
          name: persistence-jev-removal-${{ needs.resolve.outputs.head }}
          path: |
            docs/persistence-changes/2026-11-16-jev-removal.md
            docs/persistence-changes/2026-11-16-jev-removal.schema.json
          if-no-files-found: error
